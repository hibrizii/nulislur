<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .badge {
        fill: #1C1917;
        rx: 16px;
      }
      .feather-stroke {
        stroke: #FAFAF9;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      @media (prefers-color-scheme: dark) {
        .badge {
          fill: #F5F5F4;
        }
        .feather-stroke {
          stroke: #1C1917;
        }
      }
    </style>
  </defs>
  <!-- Background Badge (Sesuai Logo Halaman Masuk NulisLur) -->
  <rect class="badge" width="64" height="64" rx="16" />
  
  <!-- Icon Feather (Pena Bulu Literasi) -->
  <g transform="translate(14, 14) scale(1.5)">
    <path class="feather-stroke" d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
    <line class="feather-stroke" x1="16" y1="8" x2="2" y2="22" />
    <line class="feather-stroke" x1="17.5" y1="15" x2="9" y2="15" />
  </g>
</svg>